global:
  scrape_interval: 15s

scrape_configs:
  - job_name: kinvue-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - gateway:4000
          - host.docker.internal:4001
          - users:4002
          - movie:4003
          - rooms:4004
          - notification:4005
          - transcode-worker:4016
        labels:
          environment: local
