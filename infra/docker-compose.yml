# Local data stack for KIN-171 … KIN-209.
# Host ports below are the local example from those tickets.
# They are not an accepted port-map decision (0010).
# The auth service still uses root docker-compose.yml on port 5432 (0006).
# Start: pnpm infra:up
name: kinvue

networks:
  kinvue-data:
    name: kinvue-data
    internal: true
  kinvue-edge:
    name: kinvue-edge

volumes:
  auth-postgres-data:
  movie-postgres-data:
  users-mongo-data:
  rooms-redis-data:
  rabbitmq-data:
  meilisearch-data:
  minio-data:
  prometheus-data:
  grafana-data:

services:
  auth-postgres:
    image: postgres:16
    container_name: kinvue-auth-postgres
    environment:
      POSTGRES_USER: ${AUTH_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTH_POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    networks:
      - kinvue-data
      - kinvue-edge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${AUTH_POSTGRES_USER} -d ${AUTH_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  movie-postgres:
    image: postgres:16
    container_name: kinvue-movie-postgres
    environment:
      POSTGRES_USER: ${MOVIE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${MOVIE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${MOVIE_POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - movie-postgres-data:/var/lib/postgresql/data
    networks:
      - kinvue-data
      - kinvue-edge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MOVIE_POSTGRES_USER} -d ${MOVIE_POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  users-mongo:
    image: mongo:7
    container_name: kinvue-users-mongo
    command: ["mongod", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - users-mongo-data:/data/db
    networks:
      - kinvue-data
      - kinvue-edge
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  rooms-redis:
    image: redis:7-alpine
    container_name: kinvue-rooms-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - rooms-redis-data:/data
    networks:
      - kinvue-data
      - kinvue-edge
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: kinvue-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - kinvue-data
      - kinvue-edge
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: kinvue-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
    networks:
      - kinvue-data
      - kinvue-edge
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://127.0.0.1:7700/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio:
    # minio/minio and quay.io/minio are not anonymously pullable (removed / locked, 2026-09).
    # pgsty/minio is a drop-in: same server command, health URL, and env vars.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: kinvue-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - kinvue-data
      - kinvue-edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    container_name: kinvue-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing local/kinvue-media
        mc anonymous set none local/kinvue-media
    networks:
      - kinvue-data
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: kinvue-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - kinvue-data
      - kinvue-edge
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://127.0.0.1:9090/-/healthy",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: kinvue-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_HTTP_PORT: "3000"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - kinvue-data
      - kinvue-edge
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped
