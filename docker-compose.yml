services:
  postgres:
    image: postgres:16
    container_name: kinvue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kinvue
      POSTGRES_PASSWORD: kinvue
      POSTGRES_DB: kinvue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
