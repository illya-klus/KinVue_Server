name: Security scans

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository history with Gitleaks
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --config /repo/.gitleaks.toml --redact /repo

      - name: Confirm local env examples are allowlisted
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          dir --config /repo/.gitleaks.toml --redact /repo/.env.example

      - name: Confirm Gitleaks detects a synthetic credential
        shell: bash
        run: |
          fixture_dir="$RUNNER_TEMP/gitleaks-fixture"
          mkdir -p "$fixture_dir"
          printf 'api_key = "%s%s"\n' '8d6f1c3a9b2e4d7f' '0a1c5e8b3d6f9a2c' > "$fixture_dir/synthetic-secret.txt"

          set +e
          docker run --rm -v "$fixture_dir:/fixture:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            dir --redact /fixture
          scan_status=$?
          set -e

          if [ "$scan_status" -eq 0 ]; then
            echo "Gitleaks did not detect the synthetic credential."
            exit 1
          fi
          if [ "$scan_status" -ne 1 ]; then
            echo "Gitleaks smoke test failed with exit code $scan_status."
            exit "$scan_status"
          fi
          echo "Gitleaks detected the synthetic credential as expected."

  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Fail on high or critical advisories
        run: pnpm audit --audit-level high
